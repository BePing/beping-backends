name: Containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'prisma/**'
      - 'Dockerfile.migrate'
      - 'tools/migrate/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/containers.yml'

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_HOST: ${{ vars.HETZNER_REGISTRY_HOST }}

jobs:
  publish:
    name: Publish ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: BePing API
            image_name: beping-api
            dockerfile: apps/tabt-rest/Dockerfile
            context: .
          - title: BePing notifications
            image_name: beping-notifications
            dockerfile: apps/app-notifications/Dockerfile
            context: .
          - title: BePing importer
            image_name: beping-importer
            dockerfile: apps/data-aftt-importer/Dockerfile
            context: .
          - title: BePing challenge worker
            image_name: beping-challenge-worker
            dockerfile: apps/challenge-worker/Dockerfile
            context: .
          - title: BePing challenge web
            image_name: beping-challenge-web
            dockerfile: challenge-frontend/Dockerfile
            context: challenge-frontend
          - title: BePing migrations
            image_name: beping-migrate
            dockerfile: Dockerfile.migrate
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned challenge frontend
        if: matrix.image_name == 'beping-challenge-web'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BePing/challenge-frontend
          ref: 9f449707a1c162f06d29a7b7697f76f536d00eac
          path: challenge-frontend

      - name: Set image source metadata
        run: |
          if [[ '${{ matrix.image_name }}' == 'beping-challenge-web' ]]; then
            echo 'SOURCE_URL=https://github.com/BePing/challenge-frontend' >>"${GITHUB_ENV}"
            echo 'SOURCE_REVISION=9f449707a1c162f06d29a7b7697f76f536d00eac' >>"${GITHUB_ENV}"
          else
            echo 'SOURCE_URL=${{ github.server_url }}/${{ github.repository }}' >>"${GITHUB_ENV}"
            echo 'SOURCE_REVISION=${{ github.sha }}' >>"${GITHUB_ENV}"
          fi

      # Recent QEMU: node under emulated arm64 SIGILLs with the runner's
      # stock binfmt (pnpm install then hangs forever).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate registry configuration
        env:
          REGISTRY_USERNAME: ${{ secrets.HETZNER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.HETZNER_REGISTRY_PASSWORD }}
        run: |
          test -n "${REGISTRY_HOST}"
          test -n "${REGISTRY_USERNAME}"
          test -n "${REGISTRY_PASSWORD}"

      - name: Log in to Escape Key registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HETZNER_REGISTRY_USERNAME }}
          password: ${{ secrets.HETZNER_REGISTRY_PASSWORD }}

      - name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          IMAGE: ${{ env.REGISTRY_HOST }}/escape-key/${{ matrix.image_name }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # BePing currently runs on a Hetzner ARM host while other Escape Key
          # nodes use x86_64. Publish one immutable tag that works on both.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.title=${{ matrix.title }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
